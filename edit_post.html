<!DOCTYPE html>
<html>
<head>
    <title>Edit Post</title>
</head>
<body>

    <h1>Edit Blog Post</h1>

    <form method="POST">

        <label>Title:</label><br>

        <input
            type="text"
            name="title"
            value="{{ post.title }}"
            required
        >

        <br><br>

        <label>Content:</label><br>

        <textarea
            name="content"
            rows="10"
            cols="50"
            required
        >{{ post.content }}</textarea>

        <br><br>

        <button type="submit">Update Post</button>

    </form>

    <br>

    <a href="/dashboard">Back to Dashboard</a>

</body>
</html>
