<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Posts</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .post-form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .post-form input,
        .post-form textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .post-form textarea {
            height: 120px;
            resize: vertical;
        }

        .post-form button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .post-form button:hover {
            background: #0056b3;
        }

        .post {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .post h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .post p {
            color: #555;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .post small {
            color: #888;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #007bff;
        }
    </style>
</head>

<body>

<div class="container">

    <a href="/" class="back-btn">← Back to Home</a>

    <h1>Posts & Comments</h1>

    <!-- Create Post -->
    <div class="post-form">

        <form action="/add_post" method="POST">

            <input
                type="text"
                name="title"
                placeholder="Enter post title"
                required
            >

            <textarea
                name="content"
                placeholder="Write your post here..."
                required
            ></textarea>

            <button type="submit">
                Publish Post
            </button>

        </form>

    </div>

    <!-- Display Posts -->
    {% if posts %}

        {% for post in posts %}

        <div class="post">

            <h2>{{ post.title }}</h2>

            <p>{{ post.content }}</p>

            {% if post.author %}
                <small>
                    Posted by: {{ post.author }}
                </small>
            {% endif %}

        </div>

        {% endfor %}

    {% else %}

        <div class="post">
            <p>No posts available yet.</p>
        </div>

    {% endif %}

</div>

</body>
</html>
